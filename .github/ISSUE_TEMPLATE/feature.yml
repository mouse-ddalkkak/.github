name: 제안
description: 있으면 좋겠는 기능이나 바뀌었으면 하는 점
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 겪는 문제
      description: 무엇을 하려다 어디서 불편했나요
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: 원하는 것
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: 지금 쓰는 방법
      description: 우회하고 있는 방법이 있으면 적어 주세요
