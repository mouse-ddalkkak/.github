name: 버그
description: 딸깍이 설명과 다르게 동작할 때
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 설치가 안 되면 먼저 [README 설치가 안 될 때](https://github.com/mouse-ddalkkak/ddalkkak#설치)를 봐 주세요. 보안 취약점은 여기 말고 [비공개로 신고](https://github.com/mouse-ddalkkak/ddalkkak/security/advisories/new)해 주세요.
  - type: input
    id: version
    attributes:
      label: 딸깍 버전
      description: "`docker exec ddalkkak printenv DDALKKAK_VERSION` 결과"
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: kit
    attributes:
      label: 스타터킷 버전
      description: 검사할 앱 build.gradle · pom.xml에 넣은 `com.github.mouse-ddalkkak:ddalkkak` 버전. 스타터킷을 넣기 전이면 비워 둡니다
      placeholder: v1.1.0
  - type: dropdown
    id: env
    attributes:
      label: 딸깍을 띄운 곳
      options:
        - Windows (Docker Desktop)
        - Mac (Docker Desktop)
        - Linux
        - 기타 (아래에 적기)
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: 문제가 난 단계
      options:
        - 설치 · 로그인
        - 스타터킷 연결
        - AI 연결
        - 코드 연결
        - 검사 실행
        - 결과 화면
        - 기타
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      description: 한 일, 기대한 것, 실제로 일어난 것을 적습니다. 화면 캡처가 있으면 붙여 주세요
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그
      description: "`docker logs --tail 100 ddalkkak` 결과입니다. AI 단계면 `docker logs --tail 100 ddalkkak-ai`도 붙입니다. API 키 · 비밀번호 · 토큰은 지우고 붙여 주세요"
      render: text
